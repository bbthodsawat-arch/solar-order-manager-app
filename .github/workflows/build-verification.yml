name: Build verification

on:
  push:
    branches: [main, chore/remove-supabase-dependencies]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:workflow
      - run: npm run test:document-numbering
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

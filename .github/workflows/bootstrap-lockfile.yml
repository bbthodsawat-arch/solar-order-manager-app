name: Bootstrap npm lockfile

on:
  push:
    branches: [ci/deterministic-npm-installs]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.added, 'package-lock.json') && !contains(github.event.head_commit.modified, 'package-lock.json') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies and generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "ci: add generated package lockfile"
          git push

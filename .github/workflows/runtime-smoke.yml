name: Runtime Smoke Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Business workflow checks
        run: npm run test:workflow
      - name: Document numbering regression checks
        run: npm run test:document-numbering
      - name: Brand/product workflow checks
        run: npm run test:brand-workflow
      - name: Production build
        run: npm run build
      - name: Start production server on configured port
        run: |
          PORT=3100 NODE_ENV=production npm start > /tmp/som-server.log 2>&1 &
          echo $! > /tmp/som-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/ > /tmp/som-index.html
          grep -q 'id="root"' /tmp/som-index.html
          test -s /tmp/som-index.html
          kill $(cat /tmp/som-server.pid)
      - name: Fall back from invalid configured port
        run: |
          PORT=99999 NODE_ENV=production npm start > /tmp/som-invalid-port.log 2>&1 &
          echo $! > /tmp/som-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          kill $(cat /tmp/som-server.pid)
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/som-server.pid ]; then kill $(cat /tmp/som-server.pid) || true; fi

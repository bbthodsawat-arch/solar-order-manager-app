name: Runtime Smoke Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Start production server
        run: |
          NODE_ENV=production npm start > /tmp/som-server.log 2>&1 &
          echo $! > /tmp/som-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/som-server.log
          exit 1
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/som-server.pid ]; then kill $(cat /tmp/som-server.pid) || true; fi

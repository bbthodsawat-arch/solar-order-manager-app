name: fix-pos-customer-address
on:
  push:
    branches:
      - fix/pos-customer-address-checkout
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[pos-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch POS workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('src/pages/AddTransaction.tsx')
          s=p.read_text()
          s=s.replace("import { suggestCategory } from '../utils/categorySuggestions';", "import { suggestCategory } from '../utils/categorySuggestions';\nimport { loadData, getProvinces, getDistricts, getSubDistricts, getzip_code } from 'thai-address-select';")
          s=s.replace("province: ThaiProvinces[0],\n      zipcode: '',", "province: '',\n      district: '',\n      subdistrict: '',\n      zipcode: '',")
          s=s.replace("district: '',\n      district: '',", "district: '',")
          marker="  // Delivery / Shipping\n"
          inject="  const [thaiAddressReady, setThaiAddressReady] = useState(false);\n\n  useEffect(() => {\n    let active = true;\n    loadData().then(() => { if (active) setThaiAddressReady(true); }).catch((error) => {\n      console.error('Thai address data failed to load:', error);\n      notifyReaction('error', 'ไม่สามารถโหลดฐานข้อมูลที่อยู่ไทยได้');\n    });\n    return () => { active = false; };\n  }, []);\n\n"
          if marker in s and 'const [thaiAddressReady' not in s:
              s=s.replace(marker, inject+marker, 1)
          s=s.replace("      district: '',\n      province: cust.province || ThaiProvinces[0],\n      zipcode: cust.zipcode || '',", "      district: cust.district || '',\n      subdistrict: '',\n      province: cust.province || '',\n      zipcode: cust.zipcode || '',")
          s=s.replace("      district: crmCust.district || '',\n      province: crmCust.province || ThaiProvinces[0],", "      district: crmCust.district || '',\n      subdistrict: crmCust.subdistrict || '',\n      province: crmCust.province || '',")
          s=s.replace("  const handleCheckoutSale = async (e: FormEvent) => {\n    e.preventDefault();\n    if (cart.length === 0) return notifyReaction('warning', 'กรุณาเลือกสินค้าลงตะกร้าอย่างน้อย 1 รายการ');\n    if (!customer.name.trim()) return notifyReaction('warning', 'กรุณากรอกชื่อลูกค้า');", "  const handleCheckoutSale = async () => {\n    if (cart.length === 0) return notifyReaction('warning', 'กรุณาเลือกสินค้าลงตะกร้าอย่างน้อย 1 รายการ');\n    const customerDisplayName = customer.name.trim() || 'ลูกค้าทั่วไป';")
          old="""      // Automatically link or save customer in CRM
      let customerId = customer.id;
      try {
        customerId = await findOrCreateCustomer({
          name: customer.name.trim(),
          phoneNumber: customer.phone.trim(),
          customerAddress: customer.address.trim(),
          district: customer.district.trim(),
          province: customer.province,
          zipcode: customer.zipcode.trim(),
          customerTaxId: customer.customerTaxId.trim(),
          customerBranch: customer.customerBranch.trim(),
          email: customer.customerEmail.trim(),
        });
      } catch (crmErr) {
        console.error('CRM customer creation notice:', crmErr);
      }

      const mainSubcategory = cart[0].name;
      const detailString = cart.length > 1 
        ? `${customer.name} - ${mainSubcategory} และอื่นๆ (${cart.length} รายการ)`
        : `${customer.name} - ${mainSubcategory}`;"""
          new="""      // Link/create a CRM customer only when a real customer name was provided.
      // Blank customer name is intentionally treated as the walk-in customer.
      let customerId = customer.id;
      if (customer.name.trim()) {
        try {
          customerId = await findOrCreateCustomer({
            name: customer.name.trim(),
            phoneNumber: customer.phone.trim(),
            customerAddress: customer.address.trim(),
            district: customer.district.trim(),
            province: customer.province,
            zipcode: customer.zipcode.trim(),
            customerTaxId: customer.customerTaxId.trim(),
            customerBranch: customer.customerBranch.trim(),
            email: customer.customerEmail.trim(),
          });
        } catch (crmErr) {
          console.error('CRM customer creation notice:', crmErr);
        }
      }

      const mainSubcategory = cart[0].name;
      const detailString = cart.length > 1 
        ? `${customerDisplayName} - ${mainSubcategory} และอื่นๆ (${cart.length} รายการ)`
        : `${customerDisplayName} - ${mainSubcategory}`;"""
          if old not in s: raise SystemExit('checkout CRM block not found')
          s=s.replace(old,new,1)
          s=s.replace("        customerName: customer.name,\n        customerAddress: customer.address,\n        district: customer.district,", "        customerName: customerDisplayName,\n        customerAddress: customer.address,\n        district: customer.district,\n        subdistrict: customer.subdistrict,")
          s=s.replace("setCustomer({ name: '', address: '', district: '', province: ThaiProvinces[0], zipcode: '', phone: '',", "setCustomer({ name: '', address: '', district: '', subdistrict: '', province: '', zipcode: '', phone: '',")
          old_ui="""                  <div className=\"grid grid-cols-2 gap-2\">\n                    <select\n                      value={customer.province}\n                      onChange={e => setCustomer({...customer, province: e.target.value})}\n                      className=\"w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-2.5 py-2 text-xs font-bold text-slate-800 dark:text-white\"\n                    >\n                      {ThaiProvinces.map(p => (\n                        <option key={p} value={p}>{p}</option>\n                      ))}\n                    </select>\n\n                    <input \n                      type=\"text\" \n                      placeholder=\"รหัสไปรษณีย์\" \n                      value={customer.zipcode}\n                      onChange={e => setCustomer({...customer, zipcode: e.target.value})}\n                      className=\"w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white\"\n                    />\n                  </div>"""
          new_ui="""                  <div className=\"space-y-2\">\n                    <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-2\">\n                      <select\n                        value={customer.province}\n                        onChange={e => setCustomer({...customer, province: e.target.value, district: '', subdistrict: '', zipcode: ''})}\n                        className=\"w-full min-h-11 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white\"\n                      >\n                        <option value=\"\">เลือกจังหวัด</option>\n                        {(thaiAddressReady ? getProvinces() : ThaiProvinces).map(p => <option key={p} value={p}>{p}</option>)}\n                      </select>\n\n                      <select\n                        value={customer.district}\n                        disabled={!customer.province || !thaiAddressReady}\n                        onChange={e => setCustomer({...customer, district: e.target.value, subdistrict: '', zipcode: ''})}\n                        className=\"w-full min-h-11 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white disabled:opacity-50\"\n                      >\n                        <option value=\"\">เลือกอำเภอ/เขต</option>\n                        {customer.province && thaiAddressReady && getDistricts(customer.province).map(d => <option key={d} value={d}>{d}</option>)}\n                      </select>\n\n                      <select\n                        value={customer.subdistrict}\n                        disabled={!customer.district || !thaiAddressReady}\n                        onChange={e => {\n                          const subdistrict = e.target.value;\n                          setCustomer({...customer, subdistrict, zipcode: customer.province && customer.district && subdistrict ? getzip_code(customer.province, customer.district, subdistrict) : ''});\n                        }}\n                        className=\"w-full min-h-11 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 dark:text-white disabled:opacity-50\"\n                      >\n                        <option value=\"\">เลือกตำบล/แขวง</option>\n                        {customer.province && customer.district && thaiAddressReady && getSubDistricts(customer.province, customer.district).map(sd => <option key={sd} value={sd}>{sd}</option>)}\n                      </select>\n                    </div>\n                    <div className=\"grid grid-cols-2 gap-2\">\n                      <input type=\"text\" placeholder=\"รหัสไปรษณีย์ (อัตโนมัติ)\" value={customer.zipcode} readOnly className=\"w-full min-h-11 bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs font-black text-slate-800 dark:text-white\" />\n                      <div className=\"min-h-11 flex items-center px-3 rounded-xl bg-brand/5 border border-brand/10 text-[10px] font-bold text-slate-500 dark:text-slate-400\">\n                        {thaiAddressReady ? 'เลือกจังหวัด → อำเภอ → ตำบล แล้วระบบเติมรหัสไปรษณีย์ให้' : 'กำลังโหลดข้อมูลที่อยู่ไทย...'}\n                      </div>\n                    </div>\n                  </div>"""
          if old_ui not in s: raise SystemExit('address selector block not found')
          s=s.replace(old_ui,new_ui,1)
          s=s.replace('placeholder=\"ชื่อลูกค้า *\"', 'placeholder=\"ชื่อลูกค้า (ไม่กรอกได้ — ลูกค้าทั่วไป)\"')
          s=s.replace('<span>บันทึกการขาย (฿{formatNumber(netTotalAmount)})</span>', '<span>{customer.name.trim() ? `บันทึกการขาย (฿${formatNumber(netTotalAmount)})` : `บันทึกขายทั่วไป (฿${formatNumber(netTotalAmount)})`}</span>')
          p.write_text(s)

          pkg=Path('package.json')
          data=json.loads(pkg.read_text())
          data['dependencies']['thai-address-select']='^1.0.5'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Install and verify
        run: npm install && npm run lint && npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/pages/AddTransaction.tsx
          git commit -m "fix: make POS checkout and Thai address flow work [pos-patch]"
          git push origin HEAD:fix/pos-customer-address-checkout
      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/fix-pos-customer-address.yml
          git commit -m "chore: remove one-shot POS patch workflow [pos-patch]"
          git push origin HEAD:fix/pos-customer-address-checkout

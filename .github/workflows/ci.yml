name: CI

on:
  push:
    branches: ["main", "codex/firebase-only-hardening"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production runtime smoke test
        env:
          NODE_ENV: production
        run: |
          npm start > /tmp/som-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              echo
              echo "Production runtime smoke test passed."
              exit 0
            fi
            sleep 1
          done

          echo "Production server failed to become healthy."
          cat /tmp/som-server.log
          exit 1
